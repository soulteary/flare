version: 2

project_name: flare

before:
  hooks:
    - go run build/build.go

# A stable tag is normally pushed on the commit of its last release candidate.
# Sort a candidate below the stable tag that shares its commit; without this,
# 0.7.0-rc.1 sorts above 0.7.0 and would be selected as the tag to release.
git:
  prerelease_suffix: "-"

# A tag with a semantic-version prerelease part, such as 0.7.0-rc.1, is a
# release candidate: its GitHub Release is marked as a prerelease and it
# publishes version-tagged images only. Stable tags are unaffected.
release:
  prerelease: auto

builds:
  - <<: &build_defaults
      env:
        - CGO_ENABLED=0
      ldflags:
        - -w -s -X "github.com/soulteary/version-kit/v4.Version={{ .Tag }}" -X "github.com/soulteary/version-kit/v4.Commit={{.Commit}}" -X "github.com/soulteary/version-kit/v4.BuildDate={{.Date}}"
    id: macos
    goos: [ darwin ]
    goarch: [ amd64, arm64 ]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]
    goarm:
      - "7"
      - "6"

dockers:
  # Each entry pushes a version tag and a floating architecture tag. For a
  # release candidate the floating tag renders to an empty template, which
  # GoReleaser skips, so it keeps pointing at the latest stable release.

  - image_templates:
      - "soulteary/flare:linux-amd64-{{ .Tag }}"
      - "{{ if not .Prerelease }}soulteary/flare:linux-amd64{{ end }}"
    dockerfile: docker/goreleaser/Dockerfile.amd64
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "soulteary/flare:linux-arm64-{{ .Tag }}"
      - "{{ if not .Prerelease }}soulteary/flare:linux-arm64{{ end }}"
    dockerfile: docker/goreleaser/Dockerfile.arm64v8
    use: buildx
    goos: linux
    goarch: arm64
    goarm: ''
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "soulteary/flare:linux-armv7-{{ .Tag }}"
      - "{{ if not .Prerelease }}soulteary/flare:linux-armv7{{ end }}"
    dockerfile: docker/goreleaser/Dockerfile.arm32v7
    use: buildx
    goos: linux
    goarch: arm
    goarm: "7"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "soulteary/flare:linux-armv6-{{ .Tag }}"
      - "{{ if not .Prerelease }}soulteary/flare:linux-armv6{{ end }}"
    dockerfile: docker/goreleaser/Dockerfile.arm32v6
    use: buildx
    goos: linux
    goarch: arm
    goarm: "6"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm/v6"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"


docker_manifests:
  - name_template: "soulteary/flare:{{ .Tag }}"
    image_templates:
      - "soulteary/flare:linux-amd64-{{ .Tag }}"
      - "soulteary/flare:linux-arm64-{{ .Tag }}"
      - "soulteary/flare:linux-armv7-{{ .Tag }}"
      - "soulteary/flare:linux-armv6-{{ .Tag }}"
    skip_push: "false"

  # auto skips this manifest when the tag has a prerelease part, so a release
  # candidate never moves latest. For stable tags it behaves like "false".
  - name_template: "soulteary/flare:latest"
    image_templates:
      - "soulteary/flare:linux-amd64-{{ .Tag }}"
      - "soulteary/flare:linux-arm64-{{ .Tag }}"
      - "soulteary/flare:linux-armv7-{{ .Tag }}"
      - "soulteary/flare:linux-armv6-{{ .Tag }}"
    skip_push: auto