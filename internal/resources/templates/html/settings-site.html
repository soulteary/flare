{{ define "settings-site.html" }}<div class=setting-group-container><form method=POST action="{{ .SettingPages.Site.Path }}">{{ if .SecurityCSRFToken }}<input type=hidden name=csrf-token value="{{ .SecurityCSRFToken }}">{{ end }}<h2>{{ T .Locale "nav_site" }}</h2><p class="help-text settings-page-help">{{ T .Locale "settings_site_help" }}</p>{{ if .SettingsSaved }}<p class=settings-notice role=status>{{ T .Locale "settings_saved" }}</p>{{ end }}<div class=form-group><label for=settings-locale>{{ T .Locale "language" }}</label>
<select name=locale id=settings-locale><option value=zh {{ if eq .OptionLocale "zh" }}selected{{ end }}>{{ T .Locale "lang_zh" }}<option value=en {{ if eq .OptionLocale "en" }}selected{{ end }}>{{ T .Locale "lang_en" }}</select></div><div class=form-group><label for=settings-title>{{ T .Locale "custom_title" }}</label>
<input name=title id=settings-title class=option-input placeholder="{{ T .Locale "site_title_placeholder" }}" value="{{.OptionTitle}}"></div><div class=form-group><label for=settings-footer>{{ T .Locale "custom_footer" }}</label>
<textarea name=footer id=settings-footer class=option-input cols=30 rows=10 placeholder="{{ T .Locale "footer_placeholder" }}">{{.OptionFooter}}</textarea><p class=help-text>{{ T .Locale "footer_help" }}</div><div class=form-group><input class=btn-submit type=submit value="{{ T .Locale "save_changes" }}"></div></form></div>{{ end }}
