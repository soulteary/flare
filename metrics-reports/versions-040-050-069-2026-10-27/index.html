    (() => {
      const root = document.getElementById('flare-performance-view');
      const data = JSON.parse(root.querySelector('[data-role="data"]').textContent);
      const fields = ['qps', 'p95_ms', 'server_cpu_us', 'rss_peak_mib'];
      const digits = [0, 3, 2, 2];
      const versions = ['0.4.0', '0.5.0', '0.6.9'];
      const controls = Object.fromEntries(['size', 'phase', 'scene'].map(key => [key, root.querySelector('[data-control="' + key + '"]')]));
      let state = { size: 20, phase: 'Load', scene: 'home' };
      function restore(saved) {
        if (!saved) return;
        const value = saved.modelContent || saved;
        if ([20, 1000].includes(Number(value.size))) state.size = Number(value.size);
        if (['Load', 'Fixed'].includes(value.phase)) state.phase = value.phase;
        if (['home', 'bookmarks', 'search-last', 'redirect-last'].includes(value.scene)) state.scene = value.scene;
      }
      function render() {
        if (state.phase === 'Fixed') state.scene = 'home';
        Object.entries(controls).forEach(([key, control]) => { control.value = String(state[key]); });
        controls.scene.disabled = state.phase === 'Fixed';
        const rows = versions.map(version => data.find(row => row.size === state.size && row.phase === state.phase && row.scene === state.scene && row.version === version));
        const maxima = fields.map(key => Math.max(...rows.map(row => row.median[key])));
        const body = root.querySelector('[data-role="values"]');
        body.replaceChildren();
        rows.forEach(row => {
          const tr = document.createElement('tr');
          const label = document.createElement('th');
          label.scope = 'row'; label.textContent = row.version; tr.append(label);
          fields.forEach((key, index) => {
            const td = document.createElement('td'); td.className = 'text-end tabular-nums';
            const format = value => value.toLocaleString('zh-CN', { minimumFractionDigits: digits[index], maximumFractionDigits: digits[index] });
            const value = document.createElement('div'); value.className = 'metric-value'; value.textContent = format(row.median[key]);
            const range = document.createElement('div'); range.className = 'metric-range text-small'; range.textContent = '(' + row.range[key].map(format).join('—') + ')';
            const track = document.createElement('div'); track.className = 'bar-track'; track.setAttribute('aria-hidden', 'true');
            const fill = document.createElement('div'); fill.className = 'bar-fill'; fill.style.width = (100 * row.median[key] / maxima[index]) + '%';
            track.append(fill); td.append(value, range, track); tr.append(td);
          });
          body.append(tr);
        });
        root.querySelector('[data-role="scope"]').textContent = state.phase === 'Load' ? '每窗口 5 秒，8 个并发请求；吞吐越高越好，延迟与 CPU 越低越好。' : '首页固定 ' + (state.size === 20 ? '40' : '10') + ' 次/秒，每窗口 5 秒；此时吞吐由设定值决定。';
      }
      restore(window.openai && window.openai.widgetState);
      Object.entries(controls).forEach(([key, control]) => control.addEventListener('change', () => {
        state[key] = key === 'size' ? Number(control.value) : control.value;
        render();
        if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent: { ...state }, privateContent: null }).catch(() => {});
      }));
      window.addEventListener('openai:set_globals', event => {
        restore(event.detail && event.detail.globals && event.detail.globals.widgetState); render();
      });
      render();
