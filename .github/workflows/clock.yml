name: Clock acceptance

on:
  pull_request:
    branches: [main, feat/editor-state, feat/editor-list]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clock:
    name: Clock unit and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/clock/package-lock.json
      - name: Build production assets and binary
        run: |
          go run build/build.go
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flare-clock" .
      - name: Install browser test dependencies
        working-directory: tests/clock
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Compact mobile layout acceptance
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
        run: node tests/mobile/layout.browser.cjs
      - name: Homepage readability acceptance
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
        run: node tests/mobile/readability.browser.cjs
      - name: Desktop column layout and editor scale measurements
        run: |
          node tests/mobile/desktop-columns.browser.cjs
          node tests/editor/scale.browser.cjs
      - name: Clock logic and lifecycle regressions
        run: node --test tests/clock/clock.test.cjs
      - name: Editor state regressions
        run: node --test tests/editor/state.test.cjs
      - name: Production HTTP and browser acceptance
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
        run: node tests/clock/browser.cjs
      - name: Mobile layout and touch editor acceptance
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
        run: node tests/mobile/browser.cjs
      - name: Navigation list, form and batch acceptance
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
          EDITOR_SCREENSHOT_DIR: ${{ runner.temp }}/flare-editor-screenshots
        run: node tests/editor/browser.cjs
      - name: Upload editor view screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editor-view-screenshots
          path: ${{ runner.temp }}/flare-editor-screenshots
          if-no-files-found: ignore
      - name: Legacy bookmark compatibility
        env:
          FLARE_BINARY: ${{ runner.temp }}/flare-clock
        run: node tests/editor/legacy.browser.cjs
      - name: Minimal scratch-container timezone acceptance
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/flare-clock-image"
          mkdir -p "$context"
          cp "$RUNNER_TEMP/flare-clock" "$context/flare"
          cp tests/clock/container.yml "$context/config.yml"
          docker build -f tests/clock/Dockerfile -t flare-clock-test "$context"
          docker run --detach --name flare-clock-test -p 127.0.0.1::5005 flare-clock-test
          trap 'docker logs flare-clock-test; docker rm --force flare-clock-test' EXIT
          port="$(docker port flare-clock-test 5005/tcp | sed 's/.*://')"
          FLARE_CONTAINER_URL="http://127.0.0.1:$port" python3 tests/clock/container-smoke.py
