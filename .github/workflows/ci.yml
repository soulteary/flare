name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/editor-state, feat/editor-list, "feat/search-*"]

env:
  GO111MODULE: on

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-publishing:
    name: Validate container publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and registry safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate release workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint-v1.7.12.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/flare-actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/flare-actionlint" actionlint
          "$RUNNER_TEMP/flare-actionlint/actionlint" \
            .github/workflows/*.yml

  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go
        with:
          profile: vet

      - name: Run go vet
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go
        with:
          profile: lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test & Coverage
    env:
      COVERAGE_THRESHOLD: "90"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go
        with:
          profile: race-coverage

      - name: Build
        run: |
          go run build/build.go
          go mod tidy -diff

      - name: Run tests with coverage
        run: |
          go test -v -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: ./.github/actions/go-test-report
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: ${{ env.COVERAGE_THRESHOLD }}
          cover_pkg: "./..."
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: ./.github/actions/go-report-card
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Coverage summary
        run: GOTOOLCHAIN=auto go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.html

      # Keep push and PR coverage on the same all-package instrumentation and gate.
      - name: Check coverage threshold
        run: |
          COVER=$(go tool cover -func=coverage.out | grep 'total:' | awk '{gsub(/%/,""); print $3}')
          THRESHOLD="${COVERAGE_THRESHOLD:-0}"
          echo "Coverage: ${COVER}%, threshold: ${THRESHOLD}%"
          if ! awk -v c="$COVER" -v t="$THRESHOLD" 'BEGIN { exit (c >= t) ? 0 : 1 }'; then
            echo "Coverage ${COVER}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read

  goreleaser-config:
    name: Validate GoReleaser configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  csrf-benchmark-evidence:
    name: CSRF benchmark evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify archived measurements and report
        run: |
          python3 metrics-reports/trusted-readonly-csrf-2026-10-27/analyze.py
          python3 metrics-reports/trusted-readonly-csrf-2026-10-27/render.py --check
          python3 metrics-reports/trusted-readonly-csrf-2026-10-27/test_integrity.py
          python3 metrics-reports/trusted-readonly-csrf-2026-10-27/privacy.py
