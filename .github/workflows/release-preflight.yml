name: Release preflight (no publication)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Candidate version to verify without publication
        type: string
        default: '0.6.8'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_VERSION: ${{ inputs.candidate_version || '0.6.8' }}

jobs:
  source:
    name: Prepare verified production source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          profile: preflight-source
      - name: Generate and verify production resources once
        run: python3 scripts/release-preflight.py --version "$CANDIDATE_VERSION" --prepare-only --output "$RUNNER_TEMP/preflight-source.tar.gz"
      - uses: actions/upload-artifact@v6
        with:
          name: preflight-source-${{ github.sha }}
          path: ${{ runner.temp }}/preflight-source.tar.gz
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error

  candidates:
    name: ${{ matrix.platform && format('Local image {0}', matrix.platform) || format('Candidate {0}', matrix.target) }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: linux_armv6
            platform: linux/arm/v6
            dockerfile: arm32v6
          - target: linux_armv7
            platform: linux/arm/v7
            dockerfile: arm32v7
          - target: linux_arm64
            platform: linux/arm64
            dockerfile: arm64v8
          - target: linux_amd64
            platform: linux/amd64
            dockerfile: amd64
          - target: darwin_amd64
            platform: ''
            dockerfile: ''
          - target: darwin_arm64
            platform: ''
            dockerfile: ''
          - target: linux_386
            platform: ''
            dockerfile: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          profile: preflight-${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-source-${{ github.sha }}
          path: ${{ runner.temp }}/preflight-source
      - name: Build and verify this target once
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release-preflight.py --version "$CANDIDATE_VERSION" \
            --source-archive "$RUNNER_TEMP/preflight-source/preflight-source.tar.gz" \
            --target "$TARGET" --jobs 1 --output "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v6
        with:
          name: preflight-archive-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/*-verification.json
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v4
        if: matrix.dockerfile != '' && matrix.platform != 'linux/amd64'
        with:
          platforms: ${{ matrix.target == 'linux_arm64' && 'arm64' || 'arm' }}
      - uses: docker/setup-buildx-action@v4
        if: matrix.dockerfile != ''
      - name: Stage the verified archive binary for its container
        if: matrix.dockerfile != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-context"
          cp "$RUNNER_TEMP/candidate/$TARGET/flare" "$RUNNER_TEMP/image-context/flare"
      - name: Build release Dockerfile without pushing
        if: matrix.dockerfile != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/image-context
          file: docker/goreleaser/Dockerfile.${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: flare-local-preflight:check
          labels: |
            org.opencontainers.image.version=${{ env.CANDIDATE_VERSION }}-preflight
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=flare-preflight-${{ matrix.target }}
          cache-to: type=gha,scope=flare-preflight-${{ matrix.target }},mode=max
      - name: HTTP, timezone and restart acceptance
        if: matrix.dockerfile != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker create --name flare-preflight --platform "$PLATFORM" \
            -p 127.0.0.1::5005 -e FLARE_DISABLE_LOGIN=true -e FLARE_OFFLINE=true \
            -e TZ=America/New_York flare-local-preflight:check
          trap 'docker logs flare-preflight; docker rm -f flare-preflight' EXIT
          docker cp tests/clock/container.yml flare-preflight:/app/config.yml
          docker start flare-preflight
          port="$(docker port flare-preflight 5005/tcp | sed 's/.*://')"
          export FLARE_CONTAINER_URL="http://127.0.0.1:$port"
          python3 tests/clock/container-smoke.py
          docker restart flare-preflight
          # Docker may allocate a different random host port after restart.
          port="$(docker port flare-preflight 5005/tcp | sed 's/.*://')"
          export FLARE_CONTAINER_URL="http://127.0.0.1:$port"
          python3 tests/clock/container-smoke.py
          docker image inspect flare-local-preflight:check > "$RUNNER_TEMP/image-inspect.json"
      - uses: actions/upload-artifact@v6
        if: matrix.dockerfile != ''
        with:
          name: candidate-image-${{ matrix.dockerfile }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-inspect.json
          retention-days: 7
          overwrite: true

  archives:
    name: Seven candidate archives
    needs: candidates
    # A failed upstream build must fail this required check, not skip it green.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful builds and container acceptance
        env:
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
        run: test "$CANDIDATES_RESULT" = success
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: preflight-archive-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/preflight-archives
      - name: Verify all seven archives and extract browser candidate
        run: python3 scripts/release-preflight.py --version "$CANDIDATE_VERSION" --collect --output "$RUNNER_TEMP/preflight-archives"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/clock/package-lock.json
      - name: Install archive browser acceptance dependencies
        working-directory: tests/clock
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Verify generated editor assets in the archived binary
        env:
          FLARE_BINARY: ${{ runner.temp }}/preflight-archives/linux_amd64/flare
          NODE_PATH: ${{ github.workspace }}/tests/clock/node_modules
        run: |
          node tests/editor/browser.cjs
          node tests/editor/legacy.browser.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-archives-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/preflight-archives/*.tar.gz
            ${{ runner.temp }}/preflight-archives/*checksums.txt
            ${{ runner.temp }}/preflight-archives/archives-verification.json
          retention-days: 7
          overwrite: true
