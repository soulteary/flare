name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "0.*.*"
env:
  GO111MODULE: on
  DOCKER_CLI_EXPERIMENTAL: "enabled"

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/0.')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify stable release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Tests
        run: |
          go run build/build.go
          go mod tidy -diff
          go test -v ./...

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_ghcr:
    name: Publish the released images to GHCR
    needs: build
    if: github.repository == 'soulteary/flare' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-ghcr.yml
    with:
      version: ${{ github.ref_name }}
      expected_commit: ${{ github.sha }}
      update_latest: true

  report_release:
    name: Dispatch verified release reports
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
