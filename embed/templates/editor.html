<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理导航 · Flare</title>
<link rel="stylesheet" href="/assets/editor-ui/editor.css">
<script defer src="/assets/editor-ui/state.js"></script>
<script defer src="/assets/editor-ui/app.js"></script>
</head>
<body>
<div class="shell">
<header class="page-header"><div><a href="/" data-leave>← 返回首页</a><h1>管理导航 <small id="total-count"></small></h1></div>
<details class="menu"><summary>更多</summary><nav><a href="/editor/transfer" data-leave>导入 / 导出</a><a href="/editor/batch" data-leave>批量编辑</a><a href="/help" data-leave>使用帮助</a></nav></details></header>
<main id="workspace" aria-busy="true">
<div class="toolbar"><label class="search-label"><span class="sr-only">搜索名称、地址和描述</span><input id="entry-search" type="search" placeholder="搜索名称、地址和描述" autocomplete="off"></label><label><span class="sr-only">所属位置</span><select id="location-filter"><option value="all">全部位置</option></select></label><button id="manage-categories">管理分类</button><button id="new-entry" class="primary">＋ 新增</button></div>
<div class="list-heading"><p id="result-count" role="status">正在加载…</p><div id="undo-area" hidden><span>条目已移除</span> <button id="undo-delete" class="text-button">撤销</button></div></div>
<div id="entry-list" role="list"></div>
</main>
</div>
<footer class="savebar"><div><p id="save-status" role="status" aria-live="polite">正在加载数据…</p><div class="save-actions"><button id="export-draft" hidden>导出待保存数据</button><button id="reload-data" hidden>重新载入</button><button id="discard-changes" disabled>放弃更改</button><button id="save-changes" class="primary" disabled>保存更改</button></div></div></footer>
<dialog id="entry-dialog" aria-labelledby="entry-dialog-title"><form id="entry-form" novalidate>
<h2 id="entry-dialog-title">新增条目</h2><p class="muted">完成后，点击页面底部“保存更改”生效。</p>
<label for="entry-name">名称 <span aria-hidden="true">*</span></label><input id="entry-name" name="Name" required autocomplete="off" aria-describedby="error-name"><p class="field-error" id="error-name"></p>
<label for="entry-url">地址 <span aria-hidden="true">*</span></label><input id="entry-url" name="URL" type="text" inputmode="url" required autocomplete="off" spellcheck="false" aria-describedby="error-url"><p class="field-error" id="error-url"></p>
<label for="entry-location">放在 <span aria-hidden="true">*</span></label><select id="entry-location" name="Location" required aria-describedby="error-location"></select><p class="field-error" id="error-location"></p>
<details id="entry-options"><summary>更多选项</summary><label for="entry-icon">图标</label><div class="icon-field"><input id="entry-icon" name="Icon" placeholder="图标名称或图片地址" autocomplete="off"><span id="icon-preview" aria-label="图标预览"></span></div><label for="entry-description">描述</label><textarea id="entry-description" name="Desc" rows="3"></textarea></details>
<div class="dialog-actions"><button type="button" id="cancel-entry">取消</button><button type="submit" class="primary">完成</button></div>
</form></dialog>
<dialog id="categories-dialog" aria-labelledby="categories-title"><h2 id="categories-title">管理分类</h2><p class="muted">改名、排序和迁移会加入待保存内容。</p><div id="category-list"></div><form id="category-add-form"><label for="new-category-name">新增分类</label><div class="inline-form"><input id="new-category-name" autocomplete="off" aria-describedby="category-error"><button type="submit">添加</button></div><p id="category-error" class="field-error" role="status"></p></form><div class="dialog-actions"><button id="close-categories" class="primary">完成</button></div></dialog>
<noscript><p class="shell">编辑器需要 JavaScript。导航首页仍可正常使用。</p></noscript>
</body></html>
