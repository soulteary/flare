{{ define "settings-others.html" }}
<div class="setting-group-container">

     {{ if .DisableLoginMode }}
     {{else}}
        {{ if .UserIsLogin }}
        <form method="POST" action="{{.LogoutURI}}">
            <div class="form-group form-about">
                <h2>{{ T .Locale "login" }}</h2>

                <div class="form-group">
                    <p>{{ T .Locale "current_user" }} {{.UserName}}</p>
                    <p>{{ T .Locale "login_time" }} {{.LoginDate}}</p>
                </div>
                <div class="form-group">
                    <input class="btn-submit" type="submit" value="{{ T .Locale "logout" }}" />
                </div>
            </div>
        </form>
        {{ else }}
        <form method="POST" action="{{.LoginURI}}">
            <div class="form-group form-about">
                <h2>{{ T .Locale "login" }}</h2>

                <div class="form-group">
                    <label for="user-name">{{ T .Locale "username" }}</label>
                    <input type="text" name="username" id="user-name" class="option-input" placeholder="{{ T .Locale "username_placeholder" }}">
                </div>
                <div class="form-group">
                    <label for="user-pass">{{ T .Locale "password" }}</label>
                    <input type="password" name="password" id="user-pass" class="option-input" placeholder="{{ T .Locale "password_placeholder" }}">
                </div>
                <div class="form-group">
                    <input class="btn-submit" type="submit" value="{{ T .Locale "login" }}" />
                </div>
                <br />
            </div>
        </form>
        {{ end }}

    {{ end }}

</div>
{{ end }}
